name: Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Restore Android signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PROPERTIES_BASE64: ${{ secrets.ANDROID_SIGNING_PROPERTIES_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_SIGNING_PROPERTIES_BASE64"
          SIGNING_DIR="$RUNNER_TEMP/floorsense-signing"
          mkdir -p "$SIGNING_DIR"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_DIR/release.jks"
          printf '%s' "$ANDROID_SIGNING_PROPERTIES_BASE64" | base64 --decode > "$SIGNING_DIR/signing.properties"
          chmod 600 "$SIGNING_DIR/release.jks" "$SIGNING_DIR/signing.properties"
          printf 'FLOORSENSE_SIGNING_STORE=%s\n' "$SIGNING_DIR/release.jks" >> "$GITHUB_ENV"
          printf 'FLOORSENSE_SIGNING_PROPERTIES=%s\n' "$SIGNING_DIR/signing.properties" >> "$GITHUB_ENV"

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze --fatal-infos

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build signed ARM64 APK
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Verify and prepare APK
        run: |
          APK="app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" app/build/floorsense-arm64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: floorsense-arm64-release
          path: app/build/floorsense-arm64.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" app/build/floorsense-arm64.apk             --target "$GITHUB_SHA"             --title "$GITHUB_REF_NAME"             --generate-notes
